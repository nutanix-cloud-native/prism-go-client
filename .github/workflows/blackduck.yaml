name: Black Duck Policy Check

permissions:
  contents: read
  pull-requests: write

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/**'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/**'

jobs:
  check_approvals:
    runs-on:
      - self-hosted-nutanix-docker-small
    # Only run for external PRs (forks) via pull_request_target
    if: ${{ github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository }}
    outputs:
      check_approvals: ${{ steps.check_approvals.outputs.check_approvals }}
    steps:
      - name: Check approval status
        id: check_approvals
        uses: nutanix-cloud-native/action-check-approvals@v1

  security:
    # Run if:
    # 1. Push or schedule event
    # 2. Internal PR (pull_request event from same repo)
    # 3. External PR (pull_request_target) that has been approved
    if: ${{ always() && github.repository == 'nutanix-cloud-native/prism-go-client' &&
      (github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.repo.full_name != github.repository && needs.check_approvals.outputs.check_approvals == 'true')) }}
    needs: check_approvals
    runs-on:
      - self-hosted-nutanix-docker-small
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.14.0
        with:
          enable-cache: true

      - name: Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build Project
        run: devbox run -- make build

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "adopt"

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Black Duck Full Scan
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        uses: blackduck-inc/black-duck-security-scan@v2.6.0
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          blackducksca_scan_full: true
          blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL'

      - name: Black Duck PR Scan
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: blackduck-inc/black-duck-security-scan@v2.6.0
        env:
          DETECT_PROJECT_VERSION_NAME: ${{ github.base_ref }}
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          blackducksca_scan_full: false
          blackducksca_prComment_enabled: true
