name: Build, Lint, and Test

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'release-*'
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'release-*'

jobs:
  check_approvals:
    runs-on:
      - self-hosted-nutanix-docker-small
    # Only run for external PRs (forks) via pull_request_target
    if: ${{ github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository }}
    outputs:
      check_approvals: ${{ steps.check_approvals.outputs.status }}
    steps:
      - name: Check approval status
        id: check_approvals
        uses: nutanix-cloud-native/action-check-approvals@v1

  build:
    # Run if:
    # 1. Push event (main/release branch)
    # 2. Internal PR (pull_request event from same repo)
    # 3. External PR (pull_request_target) that has been approved
    if: ${{ always() &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && needs.check_approvals.outputs.check_approvals == 'true')) }}
    needs: check_approvals
    runs-on:
      - self-hosted-nutanix-docker-small
    env:
      EXPORT_RESULT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.14.0
        with:
          enable-cache: "true"

      - name: Run golangci-lint
        run: devbox run -- make lint-go

      - name: Check YAML linting
        run: devbox run -- make lint-yaml

      - name: Check Kubebuilder Annotation linting
        run: devbox run -- make lint-kubebuilder

      - name: Prepare coverage report
        run: devbox run -- make coverage

      - name: Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
